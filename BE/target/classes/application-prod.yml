# PostgreSQL. LMS_JWT_SECRET, LMS_AES_PASSPHRASE and LMS_AES_SALT must come from the environment.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edumanager_db}
    username: ${DB_USER:edumanager}
    password: ${DB_PASSWORD:edumanager_pass}

lms:
  seed:
    enabled: ${LMS_SEED_ENABLED:false}
