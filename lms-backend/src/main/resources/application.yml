spring:
  application:
    name: lms-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: ${MATERIAL_VIDEO_MAX_MB:500}MB
      max-request-size: ${MATERIAL_VIDEO_MAX_MB:500}MB

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

lms:
  time-zone: Asia/Ho_Chi_Minh
  default-password: ${LMS_DEFAULT_PASSWORD:12345678}
  cors:
    allowed-origins: ${LMS_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  security:
    jwt-secret: ${LMS_JWT_SECRET:}
    jwt-ttl-minutes: ${LMS_JWT_TTL_MINUTES:1440}
  crypto:
    passphrase: ${LMS_AES_PASSPHRASE:}
    salt: ${LMS_AES_SALT:}
    iterations: 310000
  storage:
    root: ${LMS_STORAGE_ROOT:./private_media}
    pdf-max-mb: ${MATERIAL_PDF_MAX_MB:50}
    video-max-mb: ${MATERIAL_VIDEO_MAX_MB:500}
  ai:
    daily-limit-student: ${AI_DAILY_LIMIT_STUDENT:40}
    daily-limit-teacher: ${AI_DAILY_LIMIT_TEACHER:200}
    max-chunks: ${RAG_MAX_CHUNKS:160}
    openrouter-api-key: ${OPENROUTER_API_KEY:}
    openrouter-base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    vilao-api-key: ${VILAO_API_KEY:}
    vilao-base-url: ${VILAO_BASE_URL:https://api.vilao.ai/v1}
    chat-provider: ${CHAT_PROVIDER:openrouter}
    chat-model: ${CHAT_MODEL:google/gemini-2.5-flash}
    fast-provider: ${FAST_PROVIDER:vilao}
    fast-model: ${FAST_MODEL:gemini-3.8-flash}
    embed-provider: ${EMBED_PROVIDER:vilao}
    embed-model: ${EMBED_MODEL:text-embedding-3-small}
    embed-dim: ${EMBED_DIM:1536}
